[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
async-task = "4.7"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
futures = "0.3"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tempfile = "3"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
toml = "1"
base64 = "0.22"
rustix = { version = "1", features = ["fs", "process"] }

# Session timing tests launch the demo optimised: `cargo build -p pilot-demo --bins --profile timing`.
[profile.timing]
inherits = "dev"
opt-level = 3
debug = 0
