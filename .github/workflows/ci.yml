# A backstop for master: the local gate (see CLAUDE.md) stays mandatory before every merge,
# and a green run here says nothing about session mode.
#
# Session tests (GPUI_PILOT_SESSION_TESTS=1) are deliberately absent: they need bwrap,
# kwin_wayland and a GPU in a private KDE session, which hosted runners cannot provide.
# They stay in the local gate; do not add them here.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info and incremental state would overflow the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  LINUX_BUILD_DEPS: pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libegl1

jobs:
  # fmt, clippy, both build profiles, then the whole suite on mesa's software Vulkan driver
  # (lavapipe). Timing budgets are skipped, since a shared runner misses them anyway.
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      GPUI_PILOT_SKIP_TIMING: "1"
    steps:
      - name: Free disk space
        # The hosted runner leaves about 14 GB free; these preinstalled toolchains are unused.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install build dependencies and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS mesa-vulkan-drivers
      # Force lavapipe: its ICD file name varies by mesa release, so find it rather than guess.
      - name: Select the lavapipe ICD
        run: |
          ls /usr/share/vulkan/icd.d/
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -Dwarnings
      # gpui-pilot's tests launch target/debug/pilot-demo, which they do not build themselves.
      - run: cargo build -p gpui-pilot -p pilot-demo --bins --locked
      - run: cargo build -p gpui-pilot -p pilot-demo --bins --profile timing --locked
      - run: cargo test --workspace --locked --no-fail-fast

  # Audits every workflow for injection, credential and pinning mistakes.
  zizmor:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          inputs: .github/workflows
          advanced-security: false
